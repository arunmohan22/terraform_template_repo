# nginx-deployment.yaml
# Purpose: Deploy a simple NGINX container in Kubernetes
# Usage:
#   kubectl apply -f nginx-deployment.yaml
#   kubectl get pods
#   kubectl get deployment nginx-deployment
#
# Dependencies:
#   - Kubernetes cluster
#   - kubectl configured

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
