{# raw tag tells jinja to start escaping double curly brackets #}{%- raw -%}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "{% endraw %}{{cookiecutter.serviceSlug}}{% raw %}.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "{% endraw %}{{cookiecutter.serviceSlug}}{% raw %}.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{%- endraw -%}{# endraw tag tells jinja to stop escaping double curly brackets #}
